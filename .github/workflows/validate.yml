name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check_version_bump.py compara contra la rama base

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Instalar las herramientas de validación
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet skills-ref==0.1.1 shellcheck-py==0.11.0.1
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validar cada skill contra la especificación
        run: |
          for skill in skills/*/; do
            agentskills validate "$skill"
          done

      - name: Validar las convenciones del repo
        run: python scripts/check_conventions.py

      - name: Comprobar que cada skill cambiada sube su versión
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_version_bump.py "origin/$BASE_REF"

      - name: Correr los tests de los scripts
        run: python -m unittest discover -s tests -v

      - name: Probar el contrato de install.sh
        run: scripts/test_install.sh

      - name: Analizar los scripts de shell
        run: shellcheck install.sh scripts/test_install.sh

  validate-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # /bin y /usr/bin primero: el Bash 3.2 y el Python 3 del sistema, los de una Mac recién configurada.
      - name: Probar el contrato de install.sh con el Bash 3.2 de macOS
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          bash --version | head -n 1
          scripts/test_install.sh

      - name: Correr los tests de los scripts con el Python 3 de macOS
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s tests -v
