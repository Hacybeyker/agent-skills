name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar el validador de Agent Skills
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet skills-ref==0.1.1
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validar cada skill contra la especificación
        run: |
          for skill in skills/*/; do
            agentskills validate "$skill"
          done

      - name: Validar las convenciones del repo
        run: python3 scripts/check_conventions.py

      - name: Analizar install.sh
        run: shellcheck install.sh
