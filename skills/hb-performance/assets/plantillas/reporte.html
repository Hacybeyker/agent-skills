<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="hb-perf-reporte" content="estructura-{{STRUCTURE}}">
<title>{{TITLE}}</title>
<style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --text: #1c1d21;
        --muted: #646872;
        --border: #e2e4e9;
        --soft: #f7f8fa;
        --accent: #3657d6;
        --accent-soft: #e9edfb;
        --before: #a3abb8;
        --after: #3657d6;
        --ok: #1e7f48;
        --ok-soft: #e3f4ea;
        --ko: #bf3a2f;
        --ko-soft: #fbe7e4;
        --same: #646872;
        --same-soft: #eef0f3;
        --warn: #9a6400;
        --warn-soft: #fff3d6;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121317;
          --surface: #1b1d23;
          --text: #eef0f4;
          --muted: #9ca2ad;
          --border: #2e323b;
          --soft: #202329;
          --accent: #8da2ff;
          --accent-soft: #232a45;
          --before: #6b7380;
          --after: #8da2ff;
          --ok: #4cc77f;
          --ok-soft: #173123;
          --ko: #ff6b5f;
          --ko-soft: #3a1f1c;
          --same: #9ca2ad;
          --same-soft: #262930;
          --warn: #f0b64a;
          --warn-soft: #3a2e14;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Inter,
          sans-serif;
      }
      header {
        background: linear-gradient(135deg, var(--accent) 0%, #6b3fd6 100%);
        color: #fff;
        padding: 40px 16px 32px;
      }
      header .inner {
        max-width: 1080px;
        margin: 0 auto;
      }
      header .kicker {
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.8;
        margin: 0 0 8px;
      }
      header h1 {
        margin: 0 0 6px;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 700;
      }
      header p {
        margin: 0;
        opacity: 0.9;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px 16px 72px;
      }
      .toc {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 8px;
      }
      .toc a {
        font-size: 13px;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 4px 12px;
        text-decoration: none;
      }
      .toc a:hover {
        text-decoration: underline;
      }
      section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 22px 24px;
        margin-top: 16px;
      }
      section.resultado {
        border: 2px solid var(--accent);
        background: var(--accent-soft);
      }
      h2 {
        margin: 0 0 12px;
        font-size: 19px;
      }
      h3 {
        margin: 18px 0 8px;
        font-size: 15px;
      }
      h4 {
        margin: 14px 0 6px;
        font-size: 14px;
        color: var(--muted);
      }
      p {
        margin: 8px 0;
      }
      .hint {
        color: var(--muted);
        font-size: 14px;
        border-left: 3px solid var(--accent);
        background: var(--soft);
        padding: 8px 12px;
        border-radius: 0 8px 8px 0;
        margin: 0 0 14px;
      }
      .hint code {
        color: var(--text);
      }
      .table-wrap {
        overflow-x: auto;
        margin: 10px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: var(--soft);
        overflow-wrap: normal;
        hyphens: none;
      }
      tbody tr:nth-child(even) {
        background: var(--soft);
      }
      /* Un endpoint largo parte donde haga falta; las columnas numéricas no se aplastan y ningún encabezado se corta. */
      td:first-child {
        font-weight: 600;
        overflow-wrap: anywhere;
        min-width: 9em;
      }
      td.num {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        min-width: 5.5em;
      }
      td code {
        overflow-wrap: anywhere;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        background: var(--soft);
        padding: 1px 5px;
        border-radius: 4px;
      }
      pre {
        background: var(--soft);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
      }
      pre code {
        background: none;
        padding: 0;
      }
      pre.diff {
        font-size: 12.5px;
        line-height: 1.45;
      }
      pre.diff span {
        display: block;
      }
      pre.diff .add {
        background: var(--ok-soft);
        color: var(--ok);
      }
      pre.diff .del {
        background: var(--ko-soft);
        color: var(--ko);
      }
      pre.diff .file {
        font-weight: 700;
        margin-top: 6px;
      }
      pre.diff .hunk {
        color: var(--muted);
      }
      .verdict,
      .state {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .v-better {
        color: var(--ok);
        background: var(--ok-soft);
      }
      .v-worse {
        color: var(--ko);
        background: var(--ko-soft);
      }
      .v-same {
        color: var(--same);
        background: var(--same-soft);
      }
      .v-warn {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .verdict.label {
        border: 1px solid currentColor;
      }
      .state {
        color: var(--same);
        background: var(--same-soft);
        white-space: normal;
      }
      .s-propuesta {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .s-aprobada,
      .s-aplicada {
        color: var(--accent);
        background: var(--accent-soft);
      }
      .s-descartada {
        color: var(--ko);
        background: var(--ko-soft);
      }
      td.ok {
        color: var(--ok);
        font-weight: 600;
      }
      td.ko {
        color: var(--ko);
        font-weight: 600;
      }
      .flow {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 4px 0 16px;
      }
      .flow .step {
        flex: 1 1 150px;
        background: var(--soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        position: relative;
      }
      .flow .step b {
        display: block;
        font-size: 26px;
        line-height: 1.1;
      }
      .flow .step span {
        font-size: 12.5px;
        color: var(--muted);
      }
      .flow .step.ok {
        border-color: var(--ok);
        background: var(--ok-soft);
      }
      .flow .step.ok b {
        color: var(--ok);
      }
      .flow .step.ko {
        border-color: var(--ko);
        background: var(--ko-soft);
      }
      .flow .step.ko b {
        color: var(--ko);
      }
      .flow .step:not(:last-child)::after {
        content: "→";
        position: absolute;
        right: -11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 14px;
      }
      .flow .step.ok::after,
      .flow .step.end::after {
        content: "";
      }
      .charts {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(300px,100%),1fr));
        gap: 14px;
        margin-bottom: 14px;
      }
      .chart {
        margin: 0;
        background: var(--soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .chart figcaption {
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .chart svg {
        width: 100%;
        max-width: 720px;
        height: auto;
        display: block;
      }
      .bar-before {
        fill: var(--before);
      }
      .bar-after {
        fill: var(--after);
      }
      .bar-server {
        fill: var(--after);
      }
      .bar-label,
      .bar-value {
        fill: var(--text);
        font-size: 12px;
      }
      .hatch {
        stroke: var(--before);
        stroke-width: 3;
      }
      .hatch-bg {
        fill: var(--surface);
      }
      .whisker {
        stroke: var(--text);
        stroke-width: 1.2;
      }
      .median {
        stroke: var(--text);
        stroke-width: 2;
      }
      .axis {
        stroke: var(--muted);
        stroke-width: 1;
      }
      .tick {
        stroke: var(--muted);
      }
      .axis-label {
        fill: var(--muted);
        font-size: 11px;
      }
      .noise {
        fill: var(--warn-soft);
        stroke: var(--warn);
        stroke-dasharray: 3 2;
        opacity: 0.9;
      }
      .lane {
        stroke: var(--border);
      }
      .mark {
        stroke: var(--warn);
        stroke-dasharray: 4 3;
      }
      .mark-dim {
        stroke: var(--border);
        stroke-dasharray: 2 3;
      }
      .mark-label {
        fill: var(--text);
        font-size: 11px;
      }
      .dot-before {
        fill: var(--before);
        stroke: var(--text);
        stroke-width: 0.6;
      }
      .dot-control {
        fill: var(--surface);
        stroke: var(--text);
        stroke-width: 1.2;
      }
      .chart-note {
        color: var(--muted);
        font-size: 13.5px;
        margin: 8px 0 0;
      }
      details > summary {
        cursor: pointer;
        color: var(--accent);
        font-weight: 600;
        margin: 8px 0;
      }
      ul,
      ol {
        margin: 6px 0;
        padding-left: 22px;
      }
      li {
        margin: 3px 0;
      }
      li code:first-child {
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      footer {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 16px 32px;
        color: var(--muted);
        font-size: 12.5px;
      }
      @media print {
        :root {
          --bg: #ffffff;
          --surface: #ffffff;
          --text: #1c1d21;
          --muted: #555a63;
          --border: #d5d8de;
          --soft: #f7f8fa;
          --accent: #3657d6;
          --accent-soft: #e9edfb;
          --before: #a3abb8;
          --after: #3657d6;
          --ok: #1e7f48;
          --ok-soft: #e3f4ea;
          --ko: #bf3a2f;
          --ko-soft: #fbe7e4;
          --same: #646872;
          --same-soft: #eef0f3;
          --warn: #9a6400;
          --warn-soft: #fff3d6;
        }
        body {
          background: #fff;
        }
        header {
          background: #333;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .chart,
        svg {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .chart {
          break-inside: avoid;
        }
        /* Los plegables (cada archivo, lo que se capturó, las rutas) se imprimen abiertos, con su título. */
        details > summary {
          list-style: none;
          font-weight: 600;
        }
        details > summary::-webkit-details-marker {
          display: none;
        }
        details::details-content {
          content-visibility: visible;
          display: block;
        }
        section {
          break-inside: avoid;
          border-color: #ccc;
        }
        .toc {
          display: none;
        }
        /* En papel no hay scroll: la tabla entra en el ancho de la página, con letra más chica y celdas que parten. */
        .table-wrap {
          overflow: visible;
        }
        table {
          font-size: 10.5px;
        }
        th,
        td {
          padding: 4px 5px;
        }
        /* Encabezados enteros: sin guion a mitad de palabra; si la tabla no entra, letra más chica y corte entre palabras. */
        th {
          font-size: 8.5px;
          letter-spacing: 0;
          overflow-wrap: normal;
          word-break: normal;
          hyphens: none;
          white-space: normal;
        }
        td:first-child,
        td.num {
          min-width: 0;
        }
        td.num {
          white-space: normal;
        }
        td,
        td:first-child,
        .verdict,
        .state {
          overflow-wrap: break-word;
          white-space: normal;
        }
        td code {
          overflow-wrap: anywhere;
        }
        pre {
          white-space: pre-wrap;
          overflow: visible;
          overflow-wrap: anywhere;
        }
      }
    </style>
<style>
  :root[data-theme="dark"] { --bg:#121317; --surface:#1b1d23; --text:#eef0f4; --muted:#9ca2ad; --border:#2e323b;
  --soft:#202329; --accent:#8da2ff; --accent-soft:#232a45; --before:#6b7380; --after:#8da2ff; --ok:#4cc77f; --ok-soft:#173123;
  --ko:#ff6b5f; --ko-soft:#3a1f1c; --same:#9ca2ad; --same-soft:#262930; --warn:#f0b64a; --warn-soft:#3a2e14; }
  header { background:linear-gradient(135deg,#3657d6 0%,#6b3fd6 100%); }
  header .inner { position:relative; }
  .theme-btn { position:absolute; right:0; top:0; background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.45); border-radius:999px; padding:4px 12px; font-size:13px; cursor:pointer; }
  .theme-btn:hover { background:rgba(255,255,255,.3); }
  /* Al imprimir, siempre claro: gana sobre el tema elegido con el botón o el del sistema (va después y pesa igual). */
  @media print {
    .theme-btn { display:none; }
    :root, :root[data-theme], :root:not([data-theme="light"]) { --bg: #ffffff; --surface: #ffffff; --text: #1c1d21; --muted: #555a63; --border: #d5d8de; --soft: #f7f8fa; --accent: #3657d6; --accent-soft: #e9edfb; --before: #a3abb8; --after: #3657d6; --ok: #1e7f48; --ok-soft: #e3f4ea; --ko: #bf3a2f; --ko-soft: #fbe7e4; --same: #646872; --same-soft: #eef0f3; --warn: #9a6400; --warn-soft: #fff3d6; }
  }
  section > h2 { display:flex; align-items:center; gap:10px; }
  .sub { color:var(--muted); font-size:14px; margin:-6px 0 14px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr)); gap:12px; margin:4px 0 8px; }
  .kpi { background:var(--soft); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .kpi .v { font-size:28px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
  .kpi .l { font-size:13px; color:var(--muted); margin-top:2px; }
  .kpi .r { font-size:12.5px; color:var(--muted); margin-top:6px; }
  .kpi.hot { border-color:var(--warn); background:var(--warn-soft); }
  .kpi.hot .v { color:var(--warn); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:12px; }
  .cards.one { grid-template-columns:1fr; }
  .card { background:var(--soft); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:12px; padding:14px 16px; }
  .card h3 { margin:0 0 6px; font-size:15.5px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .card h3 .id { color:var(--accent); font-variant-numeric:tabular-nums; }
  .card p { margin:6px 0; }
  .card.t-mejorable { border-left-color:var(--ok); }
  .card.t-bug { border-left-color:var(--ko); }
  .card.t-sin { border-left-color:var(--same); }
  .card.t-descartado { border-left-color:var(--warn); opacity:.92; }
  .card.m { border-left-color:var(--accent); background:var(--surface); }
  .fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:8px 14px; margin:10px 0 2px; }
  .field .k { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; }
  .field .x { font-size:14px; }
  .chip { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .c-warn { color:var(--warn); background:var(--warn-soft); }
  .c-ko { color:var(--ko); background:var(--ko-soft); }
  .c-ok { color:var(--ok); background:var(--ok-soft); }
  .c-same { color:var(--same); background:var(--same-soft); }
  .c-acc { color:var(--accent); background:var(--accent-soft); }
  .note { background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:10px 14px; font-size:14px; margin:12px 0 0; }
  .note.warn { background:var(--warn-soft); border-color:var(--warn); }
  .note b { display:block; margin-bottom:2px; }
  .evid { font-size:13.5px; color:var(--muted); }
  .files { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .files code { font-size:12px; }
  /* Ningún texto se corta ni ensancha la página: un código largo parte la línea y las cards no se salen de su sección. */
  p code, li code, .evid code, h3 code, .card code { overflow-wrap:anywhere; }
  .card, .kpi, .field { min-width:0; overflow-wrap:anywhere; }
  .stack { display:flex; height:34px; border-radius:8px; overflow:hidden; margin:10px 0 6px; font-size:12.5px; font-weight:600; color:#fff; }
  .stack div { display:flex; align-items:center; justify-content:center; padding:0 6px; white-space:nowrap; min-width:0; overflow:hidden; }
  .legend { display:flex; flex-wrap:wrap; gap:14px; font-size:13px; color:var(--muted); }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  table.compact td, table.compact th { padding:6px 8px; }
  .charts { grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr)); }
  .charts.three { grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); }
  .files code { overflow-wrap:anywhere; white-space:normal; }
  .flow .step b { font-size:18px; }
  header .inner > p:not(.kicker) { font-size:17px; font-weight:600; opacity:.95; margin-top:4px; }
  .flow { gap:30px; }
  .flow .step { padding:9px 12px; }
  .flow .step span { font-size:12px; }
  .flow .step:not(:last-child)::after { content:"→"; right:-25px; font-size:22px; font-weight:700; color:var(--accent); }
  section > figure.chart { margin:0 0 16px; }
  details.block { margin:14px 0 4px; }
  details.block > summary { font-size:15px; }
  table.kv { border:1px solid var(--border); border-radius:10px; border-collapse:separate; border-spacing:0; overflow:hidden; margin:6px 0; }
  table.kv th { background:var(--accent-soft); color:var(--accent); font-size:12px; border-bottom:1px solid var(--border); }
  table.kv th + th, table.kv td + td { border-left:1px solid var(--border); }
  table.kv td { background:var(--surface); border-bottom:0; width:25%; }
  table.kv td:first-child { font-weight:400; min-width:0; }
  table.kv tbody tr + tr td { border-top:1px solid var(--border); }
  .field .k { color:var(--accent); }
  .card.m { border-left:1px solid var(--border); }
  .card.t-mejorable, .card.t-bug, .card.t-sin, .card.t-descartado { border:1px solid var(--border); position:relative; }
  .card.t-mejorable::before, .card.t-bug::before, .card.t-sin::before, .card.t-descartado::before {
    content:""; position:absolute; top:-1px; left:-1px; width:34px; height:34px; border-top:4px solid; border-left:4px solid; border-top-left-radius:12px; pointer-events:none; }
  .card.t-mejorable::before { border-color:var(--ok); }
  .card.t-bug::before { border-color:var(--ko); }
  .card.t-sin::before { border-color:var(--same); }
  .card.t-descartado::before { border-color:var(--warn); }
  .ok-mark { color:var(--ok); font-weight:700; } .no-mark { color:var(--ko); font-weight:700; } .opt-mark { color:var(--warn); font-weight:700; }
  .tl-bar { fill:var(--after); }
  .tl-bar.key { fill:var(--ko); }
  .tl-main { fill:var(--warn-soft); stroke:var(--warn); stroke-dasharray:3 2; }
</style>
</head>
<body class="{{AUDIENCE}}">
<header><div class="inner"><button class="theme-btn" id="theme-btn" type="button">Tema</button><p class="kicker">{{PROJECT}}</p><h1>{{TITLE}}</h1>{{SUBTITLE}}</div></header>
<main>
{{BODY}}
</main>
<footer>Los números son medianas de varias mediciones; el detalle está en <code>estado.md</code> y <code>metricas.csv</code>. {{DATE}}.</footer>
<script>
(function () {
  var root = document.documentElement, btn = document.getElementById("theme-btn");
  function current() { return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  function paint() { btn.textContent = current() === "dark" ? "☀ Claro" : "☾ Oscuro"; }
  try { var saved = localStorage.getItem("hb-perf-tema"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("hb-perf-tema", next); } catch (e) {}
    paint();
  });
  paint();
})();
// Un texto dentro de un segmento solo si cabe completo: el texto, si no el valor, si no nada (la leyenda lo dice).
(function () {
  function fit() {
    var all = document.querySelectorAll("[data-full]");
    for (var i = 0; i < all.length; i++) {
      var seg = all[i], options = [seg.getAttribute("data-full"), seg.getAttribute("data-short"), ""];
      for (var k = 0; k < options.length; k++) {
        seg.textContent = options[k];
        if (!options[k] || seg.scrollWidth <= seg.clientWidth) break;
      }
    }
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("beforeprint", fit);
})();
</script>
