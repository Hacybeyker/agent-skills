<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --border: #e3e3e6;
    --before: #9aa4b2; --after: #4f6bed; --better: #1f8a4c; --worse: #c4372d; --same: #6e6e73;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --surface: #1d1d20; --text: #f2f2f4; --muted: #a0a0a8; --border: #33333a;
      --before: #6b7380; --after: #8da2ff; --better: #4cc77f; --worse: #ff6b5f; --same: #a0a0a8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 26px; }
  header p { margin: 0; color: var(--muted); }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; margin-top: 20px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .verdict { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
             border: 1px solid currentColor; white-space: nowrap; }
  .v-better { color: var(--better); } .v-worse { color: var(--worse); } .v-same { color: var(--same); }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .chart { margin: 0; } .chart figcaption { font-weight: 600; margin-bottom: 6px; }
  .chart svg { width: 100%; height: auto; }
  .bar-before { fill: var(--before); } .bar-after { fill: var(--after); }
  .bar-label, .bar-value { fill: var(--text); font-size: 12px; }
  .card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .card p { margin: 4px 0; }
  .muted { color: var(--muted); }
  ul { margin: 0; padding-left: 20px; }
</style>
</head>
<body>
<main>
<header>
  <h1>{{TITLE}}</h1>
  <p>{{SUBTITLE}}</p>
</header>
{{BODY}}
</main>
</body>
</html>
