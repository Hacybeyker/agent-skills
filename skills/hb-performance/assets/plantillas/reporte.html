<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --text: #1c1d21; --muted: #646872; --border: #e2e4e9; --soft: #f7f8fa;
    --accent: #3657d6; --accent-soft: #e9edfb;
    --before: #a3abb8; --after: #3657d6;
    --ok: #1e7f48; --ok-soft: #e3f4ea; --ko: #bf3a2f; --ko-soft: #fbe7e4; --same: #646872; --same-soft: #eef0f3;
    --warn: #9a6400; --warn-soft: #fff3d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121317; --surface: #1b1d23; --text: #eef0f4; --muted: #9ca2ad; --border: #2e323b; --soft: #202329;
      --accent: #8da2ff; --accent-soft: #232a45;
      --before: #6b7380; --after: #8da2ff;
      --ok: #4cc77f; --ok-soft: #173123; --ko: #ff6b5f; --ko-soft: #3a1f1c; --same: #9ca2ad; --same-soft: #262930;
      --warn: #f0b64a; --warn-soft: #3a2e14;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
  header { background: linear-gradient(135deg, var(--accent) 0%, #6b3fd6 100%); color: #fff; padding: 40px 16px 32px; }
  header .inner { max-width: 1080px; margin: 0 auto; }
  header .kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .8; margin: 0 0 8px; }
  header h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.2; font-weight: 700; }
  header p { margin: 0; opacity: .9; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 72px; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
  .toc a { font-size: 13px; color: var(--accent); background: var(--accent-soft); border-radius: 999px;
           padding: 4px 12px; text-decoration: none; }
  .toc a:hover { text-decoration: underline; }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 22px 24px; margin-top: 16px; }
  section.resultado { border: 2px solid var(--accent); background: var(--accent-soft); }
  h2 { margin: 0 0 12px; font-size: 19px; }
  h3 { margin: 18px 0 8px; font-size: 15px; }
  h4 { margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
  p { margin: 8px 0; }
  .hint { color: var(--muted); font-size: 14px; border-left: 3px solid var(--accent); background: var(--soft);
          padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 0 0 14px; }
  .hint code { color: var(--text); }
  .table-wrap { overflow-x: auto; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; font-size: 12.5px; text-transform: uppercase;
       letter-spacing: .04em; background: var(--soft); }
  tbody tr:nth-child(even) { background: var(--soft); }
  td:first-child { font-weight: 600; white-space: nowrap; }
  td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--soft);
         padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--soft); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  pre.diff { font-size: 12.5px; line-height: 1.45; } pre.diff span { display: block; }
  pre.diff .add { background: var(--ok-soft); color: var(--ok); } pre.diff .del { background: var(--ko-soft); color: var(--ko); }
  pre.diff .file { font-weight: 700; margin-top: 6px; } pre.diff .hunk { color: var(--muted); }
  .verdict, .state { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
                     white-space: nowrap; }
  .v-better { color: var(--ok); background: var(--ok-soft); }
  .v-worse { color: var(--ko); background: var(--ko-soft); }
  .v-same { color: var(--same); background: var(--same-soft); }
  .state { color: var(--same); background: var(--same-soft); white-space: normal; }
  .s-propuesta { color: var(--warn); background: var(--warn-soft); }
  .s-aprobada, .s-aplicada { color: var(--accent); background: var(--accent-soft); }
  .s-descartada { color: var(--ko); background: var(--ko-soft); }
  td.ok { color: var(--ok); font-weight: 600; }
  td.ko { color: var(--ko); font-weight: 600; }
  .flow { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 16px; }
  .flow .step { flex: 1 1 150px; background: var(--soft); border: 1px solid var(--border); border-radius: 10px;
                padding: 12px 14px; position: relative; }
  .flow .step b { display: block; font-size: 26px; line-height: 1.1; }
  .flow .step span { font-size: 12.5px; color: var(--muted); }
  .flow .step.ok { border-color: var(--ok); background: var(--ok-soft); } .flow .step.ok b { color: var(--ok); }
  .flow .step.ko { border-color: var(--ko); background: var(--ko-soft); } .flow .step.ko b { color: var(--ko); }
  .flow .step:not(:last-child)::after { content: "→"; position: absolute; right: -11px; top: 50%; transform: translateY(-50%);
                                         color: var(--muted); font-size: 14px; }
  .flow .step.ok::after, .flow .step.end::after { content: ""; }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .chart { margin: 0; background: var(--soft); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .chart figcaption { font-weight: 600; margin-bottom: 8px; font-size: 14px; display: flex; gap: 8px; align-items: center;
                      flex-wrap: wrap; }
  .chart svg { width: 100%; max-width: 720px; height: auto; display: block; }
  .bar-before { fill: var(--before); } .bar-after { fill: var(--after); } .bar-server { fill: var(--after); }
  .bar-label, .bar-value { fill: var(--text); font-size: 12px; }
  .hatch { stroke: var(--before); stroke-width: 3; } .hatch-bg { fill: var(--surface); }
  .whisker { stroke: var(--text); stroke-width: 1.2; } .median { stroke: var(--text); stroke-width: 2; }
  .axis { stroke: var(--muted); stroke-width: 1; } .tick { stroke: var(--muted); }
  .axis-label { fill: var(--muted); font-size: 11px; }
  .noise { fill: var(--warn-soft); stroke: var(--warn); stroke-dasharray: 3 2; opacity: .9; }
  .lane { stroke: var(--border); } .mark { stroke: var(--warn); stroke-dasharray: 4 3; }
  .dot-before { fill: var(--before); stroke: var(--text); stroke-width: .6; }
  .dot-control { fill: var(--surface); stroke: var(--text); stroke-width: 1.2; }
  .chart-note { color: var(--muted); font-size: 13.5px; margin: 8px 0 0; }
  details > summary { cursor: pointer; color: var(--accent); font-weight: 600; margin: 8px 0; }
  ul, ol { margin: 6px 0; padding-left: 22px; }
  li { margin: 3px 0; }
  li code:first-child { font-weight: 600; }
  .muted { color: var(--muted); }
  footer { max-width: 1080px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 12.5px; }
  @media print {
    :root {
      --bg: #ffffff; --surface: #ffffff; --text: #1c1d21; --muted: #555a63; --border: #d5d8de; --soft: #f7f8fa;
      --accent: #3657d6; --accent-soft: #e9edfb; --before: #a3abb8; --after: #3657d6;
      --ok: #1e7f48; --ok-soft: #e3f4ea; --ko: #bf3a2f; --ko-soft: #fbe7e4; --same: #646872; --same-soft: #eef0f3;
      --warn: #9a6400; --warn-soft: #fff3d6;
    }
    body { background: #fff; } header { background: #333; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .chart, svg { -webkit-print-color-adjust: exact; print-color-adjust: exact; } .chart { break-inside: avoid; }
    details > summary { display: none; }
    section { break-inside: avoid; border-color: #ccc; } .toc { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="inner">
    <p class="kicker">hb-performance · rendimiento Android</p>
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </div>
</header>
<main>
{{BODY}}
</main>
<footer>Generado por hb-performance. Los números son medianas de varias corridas; el detalle está en <code>estado.md</code> y <code>metricas.csv</code> de la misma carpeta.</footer>
</body>
</html>
