<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{{PROJECT_NAME}} — Implementation Report</title>
    <style>
        /* ─── Design Tokens ─────────────────────────────────────── */
        :root {
          --bg-primary:    #0d1117;
          --bg-secondary:  #161b22;
          --bg-card:       #21262d;
          --bg-hover:      #2d333b;
          --border:        #30363d;
          --border-subtle: #21262d;

          --text-primary:   #e6edf3;
          --text-secondary: #8b949e;
          --text-muted:     #6e7681;

          --accent-blue:   #2f81f7;
          --accent-green:  #3fb950;
          --accent-red:    #f85149;
          --accent-orange: #d29922;
          --accent-purple: #a371f7;
          --accent-teal:   #39d353;

          --badge-feature:     #1f6feb; /* blue */
          --badge-bugfix:      #b62324; /* red */
          --badge-enhancement: #6e40c9; /* purple */
          --badge-refactor:    #9e6a03; /* yellow */

          --diff-add-bg:     rgba(63, 185, 80, 0.12);
          --diff-add-border: #3fb950;
          --diff-del-bg:     rgba(248, 81, 73, 0.12);
          --diff-del-border: #f85149;
          --diff-hunk-bg:    rgba(47, 129, 247, 0.08);

          --code-bg:  #161b22;
          --radius-sm: 6px;
          --radius-md: 8px;
          --radius-lg: 12px;
        }

        /* ─── Reset & Base ──────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
                       Helvetica, Arial, sans-serif;
          background: var(--bg-primary);
          color: var(--text-primary);
          font-size: 14px;
          line-height: 1.6;
          min-height: 100vh;
        }
        a { color: var(--accent-blue); text-decoration: none; }
        a:hover { text-decoration: underline; }
        code, pre {
          font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
          font-size: 12px;
        }

        /* ─── Layout ─────────────────────────────────────────────── */
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px 64px; }

        /* ─── Top Bar ────────────────────────────────────────────── */
        .topbar {
          background: var(--bg-secondary);
          border-bottom: 1px solid var(--border);
          padding: 0 24px;
          display: flex;
          align-items: center;
          gap: 12px;
          height: 56px;
          position: sticky;
          top: 0;
          z-index: 100;
        }
        .topbar-logo {
          font-size: 18px;
          font-weight: 700;
          color: var(--text-primary);
          letter-spacing: -0.3px;
        }
        .topbar-sep { color: var(--border); font-size: 20px; }
        .topbar-title { color: var(--text-secondary); font-size: 13px; }
        .topbar-spacer { flex: 1; }
        .topbar-date { color: var(--text-muted); font-size: 12px; }

        /* ─── Hero ───────────────────────────────────────────────── */
        .hero {
          padding: 40px 0 32px;
          border-bottom: 1px solid var(--border);
          margin-bottom: 32px;
        }
        .hero-eyebrow {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 12px;
        }
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          padding: 3px 10px;
          border-radius: 20px;
          font-size: 11px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }
        .badge-feature     { background: rgba(31,111,235,.25); color: #58a6ff; border: 1px solid rgba(31,111,235,.4); }
        .badge-bugfix      { background: rgba(182,35,36,.25);  color: #ff7b72; border: 1px solid rgba(182,35,36,.4); }
        .badge-enhancement { background: rgba(110,64,201,.25); color: #c6a0fc; border: 1px solid rgba(110,64,201,.4); }
        .badge-refactor    { background: rgba(158,106,3,.25);  color: #e3b341; border: 1px solid rgba(158,106,3,.4); }

        .hero-title {
          font-size: 28px;
          font-weight: 700;
          letter-spacing: -0.5px;
          color: var(--text-primary);
          margin-bottom: 8px;
        }
        .hero-desc { color: var(--text-secondary); font-size: 15px; max-width: 720px; }

        /* ─── Stats Row ──────────────────────────────────────────── */
        .stats-row {
          display: flex;
          gap: 16px;
          flex-wrap: wrap;
          margin-top: 24px;
        }
        .stat-card {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: var(--radius-md);
          padding: 14px 20px;
          min-width: 130px;
        }
        .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-primary); }
        .stat-value.green  { color: var(--accent-green); }
        .stat-value.red    { color: var(--accent-red); }
        .stat-value.orange { color: var(--accent-orange); }

        /* ─── Section ────────────────────────────────────────────── */
        .section { margin-bottom: 40px; }
        .section-header {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 16px;
          padding-bottom: 10px;
          border-bottom: 1px solid var(--border);
        }
        .section-icon { font-size: 16px; }
        .section-title {
          font-size: 16px;
          font-weight: 600;
          color: var(--text-primary);
        }
        .section-count {
          background: var(--bg-card);
          border: 1px solid var(--border);
          color: var(--text-secondary);
          border-radius: 20px;
          padding: 1px 8px;
          font-size: 11px;
        }

        /* ─── File Entry ─────────────────────────────────────────── */
        .file-entry {
          background: var(--bg-secondary);
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          margin-bottom: 16px;
          overflow: hidden;
        }
        .file-header {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 12px 16px;
          cursor: pointer;
          user-select: none;
          background: var(--bg-card);
          border-bottom: 1px solid var(--border);
        }
        .file-header:hover { background: var(--bg-hover); }
        .file-status {
          font-size: 10px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          padding: 2px 7px;
          border-radius: 4px;
        }
        .status-new      { background: rgba(63,185,80,.2);  color: #3fb950; }
        .status-modified { background: rgba(47,129,247,.2); color: #58a6ff; }
        .status-deleted  { background: rgba(248,81,73,.2);  color: #f85149; }

        .file-path {
          font-family: 'SFMono-Regular', Consolas, monospace;
          font-size: 12px;
          color: var(--text-primary);
          flex: 1;
        }
        .file-toggle {
          color: var(--text-muted);
          font-size: 12px;
          transition: transform 0.2s;
        }
        .file-entry.open .file-toggle { transform: rotate(180deg); }
        .file-body { display: none; padding: 0; }
        .file-entry.open .file-body { display: block; }

        /* ─── Code Panels ────────────────────────────────────────── */
        .panel-tabs {
          display: flex;
          border-bottom: 1px solid var(--border);
        }
        .panel-tab {
          padding: 8px 16px;
          font-size: 12px;
          font-weight: 500;
          color: var(--text-secondary);
          cursor: pointer;
          border-bottom: 2px solid transparent;
          margin-bottom: -1px;
        }
        .panel-tab.active {
          color: var(--text-primary);
          border-bottom-color: var(--accent-blue);
        }
        .panel-content { display: none; }
        .panel-content.active { display: block; }

        pre.code-block {
          margin: 0;
          padding: 16px;
          background: var(--code-bg);
          overflow-x: auto;
          font-size: 12px;
          line-height: 1.6;
          color: var(--text-primary);
          tab-size: 4;
        }
        pre.code-block .line-num {
          display: inline-block;
          width: 36px;
          color: var(--text-muted);
          text-align: right;
          padding-right: 12px;
          user-select: none;
        }

        /* ─── Diff view ──────────────────────────────────────────── */
        .diff-block {
          font-size: 12px;
          line-height: 1.6;
          background: var(--code-bg);
          overflow-x: auto;
        }
        .diff-line {
          display: flex;
          align-items: stretch;
          white-space: pre;
          font-family: 'SFMono-Regular', Consolas, monospace;
        }
        .diff-line .gutter {
          width: 40px;
          min-width: 40px;
          text-align: right;
          padding: 0 8px;
          color: var(--text-muted);
          user-select: none;
          border-right: 1px solid var(--border);
        }
        .diff-line .content { padding: 0 12px; flex: 1; }
        .diff-line.add   { background: var(--diff-add-bg); }
        .diff-line.add   .gutter { border-right-color: var(--diff-add-border); color: var(--accent-green); }
        .diff-line.del   { background: var(--diff-del-bg); }
        .diff-line.del   .gutter { border-right-color: var(--diff-del-border); color: var(--accent-red); }
        .diff-line.hunk  { background: var(--diff-hunk-bg); color: var(--accent-blue); }

        /* ─── DoD Table ──────────────────────────────────────────── */
        .dod-grid {
          display: grid;
          grid-template-columns: auto 1fr auto auto;
          gap: 0;
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          overflow: hidden;
        }
        .dod-row {
          display: contents;
        }
        .dod-row > div {
          padding: 12px 16px;
          border-bottom: 1px solid var(--border-subtle);
          background: var(--bg-secondary);
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .dod-row:last-child > div { border-bottom: none; }
        .dod-row:hover > div { background: var(--bg-card); }
        .dod-row > div:first-child { font-size: 18px; justify-content: center; width: 48px; }
        .dod-row > div:nth-child(2) { font-weight: 500; flex: 1; }
        .dod-row > div:nth-child(3) { font-family: monospace; font-size: 11px; color: var(--text-muted); max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dod-row > div:last-child   { width: 90px; justify-content: center; }

        .dod-header > div {
          background: var(--bg-card) !important;
          font-size: 11px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          color: var(--text-muted);
        }
        .pill {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          padding: 3px 10px;
          border-radius: 20px;
          font-size: 11px;
          font-weight: 600;
        }
        .pill-pass    { background: rgba(63,185,80,.2);  color: #3fb950; }
        .pill-fail    { background: rgba(248,81,73,.2);  color: #f85149; }
        .pill-skipped { background: rgba(110,110,110,.2); color: #8b949e; }

        /* ─── Footer ─────────────────────────────────────────────── */
        .footer {
          border-top: 1px solid var(--border);
          padding: 24px 0;
          margin-top: 48px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          color: var(--text-muted);
          font-size: 12px;
        }
        .footer-brand { font-weight: 600; color: var(--text-secondary); }

        /* ─── Change Summary ────────────────────────────────────── */
        .change-summary {
          display: flex;
          border-bottom: 1px solid var(--border);
        }
        .change-summary-item {
          flex: 1;
          padding: 10px 16px;
          font-size: 12px;
          line-height: 1.6;
          color: var(--text-secondary);
        }
        .change-summary-item + .change-summary-item {
          border-left: 1px solid var(--border);
        }
        .change-summary-before {
          background: rgba(248, 81, 73, 0.05);
          border-left: 3px solid var(--accent-red);
        }
        .change-summary-after {
          background: rgba(63, 185, 80, 0.05);
          border-left: 3px solid var(--accent-green);
        }
        .change-summary-label {
          font-size: 10px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          margin-bottom: 4px;
        }
        .change-summary-before .change-summary-label { color: var(--accent-red); }
        .change-summary-after  .change-summary-label { color: var(--accent-green); }

        /* ─── Utilities ──────────────────────────────────────────── */
        .tag {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: 4px;
          padding: 1px 6px;
          font-size: 11px;
          font-family: monospace;
          color: var(--text-secondary);
        }
        .empty-state {
          color: var(--text-muted);
          font-style: italic;
          font-size: 13px;
          padding: 16px;
        }
    </style>
</head>
<body>
<!-- El contenido lo genera scripts/report.py: de este archivo solo se usan <style> y <script>. -->

<script>
    /* Toggle collapsible file entries */
    function toggleFile(headerEl) {
      const entry = headerEl.closest('.file-entry');
      entry.classList.toggle('open');
    }

    /* Tab switching within a file entry (before/after/diff) */
    function switchTab(fileId, tab) {
      const tabsEl = document.getElementById('tabs-' + fileId);
      if (!tabsEl) return;

      // Update tab active state
      tabsEl.querySelectorAll('.panel-tab').forEach((el, i) => {
        const labels = ['before', 'after', 'diff'];
        el.classList.toggle('active', labels[i] === tab);
      });

      // Show correct panel
      ['before', 'after', 'diff'].forEach(t => {
        const panel = document.getElementById(fileId + '-' + t);
        if (panel) panel.classList.toggle('active', t === tab);
      });
    }

    /* Expand all file entries on load (optional — remove to collapse by default) */
    document.querySelectorAll('.file-entry').forEach(el => el.classList.add('open'));
</script>

</body>
</html>
