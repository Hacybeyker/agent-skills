<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PROJECT_NAME}} — Reporte de implementación</title>
<script id="theme-early">
  /* Aplica el tema guardado antes de pintar, para que no parpadee. */
  try { var hbTheme = localStorage.getItem("hb-implement-tema"); if (hbTheme === "dark" || hbTheme === "light") document.documentElement.setAttribute("data-theme", hbTheme); } catch (e) {}
</script>
<style>
  /* Sistema de tema copiado de hb-performance (assets/plantillas/reporte.html): los mismos tokens, el tema del
     sistema por defecto, un botón para cambiarlo y la elección recordada. Cada skill lleva su copia: se instala sola. */
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1c1d21;
    --muted: #646872;
    --border: #e2e4e9;
    --soft: #f7f8fa;
    --accent: #3657d6;
    --accent-soft: #e9edfb;
    --before: #a3abb8;
    --after: #3657d6;
    --ok: #1e7f48;
    --ok-soft: #e3f4ea;
    --ko: #bf3a2f;
    --ko-soft: #fbe7e4;
    --same: #646872;
    --same-soft: #eef0f3;
    --warn: #9a6400;
    --warn-soft: #fff3d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121317;
      --surface: #1b1d23;
      --text: #eef0f4;
      --muted: #9ca2ad;
      --border: #2e323b;
      --soft: #202329;
      --accent: #8da2ff;
      --accent-soft: #232a45;
      --before: #6b7380;
      --after: #8da2ff;
      --ok: #4cc77f;
      --ok-soft: #173123;
      --ko: #ff6b5f;
      --ko-soft: #3a1f1c;
      --same: #9ca2ad;
      --same-soft: #262930;
      --warn: #f0b64a;
      --warn-soft: #3a2e14;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121317;
    --surface: #1b1d23;
    --text: #eef0f4;
    --muted: #9ca2ad;
    --border: #2e323b;
    --soft: #202329;
    --accent: #8da2ff;
    --accent-soft: #232a45;
    --before: #6b7380;
    --after: #8da2ff;
    --ok: #4cc77f;
    --ok-soft: #173123;
    --ko: #ff6b5f;
    --ko-soft: #3a1f1c;
    --same: #9ca2ad;
    --same-soft: #262930;
    --warn: #f0b64a;
    --warn-soft: #3a2e14;
  }

  /* ─── Base ─────────────────────────────────────────────────────────────── */
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  }
  a { color: var(--accent); }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  p { margin: 8px 0; }
  ul { margin: 6px 0; padding-left: 20px; }

  /* ─── Cabecera ─────────────────────────────────────────────────────────── */
  header { background: linear-gradient(135deg, #3657d6 0%, #6b3fd6 100%); color: #fff; padding: 36px 16px 28px; }
  header .inner { max-width: 1080px; margin: 0 auto; position: relative; }
  header .kicker { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; margin: 0 0 8px; padding-right: 120px; }
  header h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
  header .lead { margin: 0; opacity: 0.92; max-width: 760px; overflow-wrap: anywhere; }
  .theme-btn { position: absolute; right: 0; top: 0; background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .theme-btn:hover { background: rgba(255,255,255,.3); }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .hchip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: #fff; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.42); max-width: 100%; overflow-wrap: anywhere; }
  .hchip.sev-critico { background: #b42318; border-color: #ffd0ca; }
  .hchip.sev-alto { background: #8a5a00; border-color: #ffe2a8; }
  .hchip.sev-medio { background: #2b44a8; border-color: #c9d3ff; }
  .hchip.sev-bajo { background: #1e7f48; border-color: #bfe8cf; }

  /* ─── Contenido ────────────────────────────────────────────────────────── */
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 72px; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
  .toc a { font-size: 13px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 12px; text-decoration: none; overflow-wrap: anywhere; }
  .toc a:hover { text-decoration: underline; }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-top: 16px; min-width: 0; }
  h2 { margin: 0 0 12px; font-size: 19px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h3 { margin: 22px 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .count { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--soft); border: 1px solid var(--border); border-radius: 999px; padding: 0 9px; }
  .sub { color: var(--muted); font-size: 14px; margin: -6px 0 14px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr)); gap: 12px; margin: 4px 0 8px; }
  .kpi { background: var(--soft); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; min-width: 0; }
  .stat-value { font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 12.5px; color: var(--muted); }
  .stat-value.green { color: var(--ok); }
  .stat-value.red { color: var(--ko); }
  .stat-value.orange { color: var(--warn); }
  .stat-value.blue { color: var(--accent); }

  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .c-ok, .st-new, .risk-bajo { color: var(--ok); background: var(--ok-soft); }
  .c-ko, .st-deleted, .risk-critico { color: var(--ko); background: var(--ko-soft); }
  .c-warn, .risk-alto { color: var(--warn); background: var(--warn-soft); }
  .c-acc, .st-modified, .risk-medio { color: var(--accent); background: var(--accent-soft); }
  .c-same { color: var(--same); background: var(--same-soft); }
  .repo-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; overflow-wrap: anywhere; }
  h2 .repo-tag { font-size: 16px; padding: 2px 10px; }

  .note { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 12px 0 0; overflow-wrap: anywhere; }
  .note.warn { background: var(--warn-soft); border-color: var(--warn); }
  .note.ko { background: var(--ko-soft); border-color: var(--ko); }
  .note b { display: block; margin-bottom: 2px; }
  .note ul { margin: 4px 0 0; }
  .note-block { background: var(--soft); border: 1px solid var(--border); border-left: 4px solid var(--warn); border-radius: 10px; padding: 12px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .table-wrap { overflow-x: auto; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.04em; background: var(--soft); white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td code { overflow-wrap: anywhere; }
  /* La tabla de unidades no parte la rama ni la base: si no entra, se desplaza dentro de su caja. */
  table.units td { white-space: nowrap; }

  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px 16px; margin: 4px 0 6px; }
  .field { min-width: 0; overflow-wrap: anywhere; }
  .field .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); font-weight: 600; }
  .field .x { font-size: 14px; }

  .impact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px; }
  .impact-value { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }

  /* ─── Archivos ─────────────────────────────────────────────────────────── */
  details.file { border: 1px solid var(--border); border-radius: 12px; margin: 10px 0; background: var(--surface); overflow: hidden; }
  details.file > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; background: var(--soft); cursor: pointer; list-style: none; }
  details.file > summary::-webkit-details-marker { display: none; }
  details.file > summary::before { content: "▸"; color: var(--muted); font-size: 12px; transition: transform .15s; }
  details.file[open] > summary::before { transform: rotate(90deg); }
  details.file[open] > summary { border-bottom: 1px solid var(--border); }
  .file-path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; min-width: 0; flex: 1 1 220px; }
  .file-body { min-width: 0; }

  .explain, .proscons { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); border-bottom: 1px solid var(--border); }
  .ex { padding: 10px 16px; font-size: 14px; border-left: 4px solid var(--border); min-width: 0; overflow-wrap: anywhere; }
  .ex .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
  .ex p { margin: 0; }
  .ex-before { border-left-color: var(--ko); background: var(--ko-soft); }
  .ex-before .k { color: var(--ko); }
  .ex-after { border-left-color: var(--ok); background: var(--ok-soft); }
  .ex-after .k { color: var(--ok); }
  .ex-pros { border-left-color: var(--ok); }
  .ex-pros .k { color: var(--ok); }
  .ex-cons { border-left-color: var(--warn); }
  .ex-cons .k { color: var(--warn); }
  .ex ul { margin: 2px 0 0; padding-left: 18px; }
  .file-notes { padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .file-notes .note { margin: 0; }
  .file-notes .note + .note { margin-top: 8px; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding: 0 10px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 8px 12px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .panel { display: none; }
  .panel.active { display: block; }

  pre.code { margin: 0; padding: 12px 0; background: var(--soft); color: var(--text); overflow-x: auto; line-height: 1.55; tab-size: 4; }
  pre.code .ln { display: inline-block; width: 4em; padding-right: 14px; text-align: right; color: var(--muted); user-select: none; }
  pre.code.dim { opacity: 0.7; }
  .diff { background: var(--soft); overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; padding: 6px 0; }
  .diff-inner { display: inline-block; min-width: 100%; }
  .dl { display: flex; white-space: pre; }
  .dl .g { flex: none; width: 4em; padding: 0 10px; text-align: right; color: var(--muted); border-right: 2px solid var(--border); user-select: none; }
  .dl .c { padding: 0 14px; }
  .dl.add { background: var(--ok-soft); }
  .dl.add .g { color: var(--ok); border-right-color: var(--ok); }
  .dl.del { background: var(--ko-soft); }
  .dl.del .g { color: var(--ko); border-right-color: var(--ko); }
  .dl.hunk { background: var(--accent-soft); color: var(--accent); }
  .empty-state { color: var(--muted); font-style: italic; font-size: 14px; padding: 12px 16px; }

  /* ─── Diagramas, previews, cambios temporales y no atribuidos ─────────── */
  .diagram { border: 1px solid var(--border); border-radius: 12px; margin: 0 0 14px; overflow: hidden; }
  .diagram-title { padding: 10px 16px; font-weight: 600; background: var(--soft); border-bottom: 1px solid var(--border); }
  .diagram-body { overflow-x: auto; padding: 16px; }
  pre.mermaid { margin: 0; white-space: pre; color: var(--muted); background: transparent; }
  pre.mermaid.rendered { display: none; }
  .diagram-svg { text-align: center; }
  .diagram-svg svg { max-width: 100%; height: auto; }
  .diagram-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .diagram-light { display: none; }
    :root:not([data-theme="light"]) .diagram-dark { display: block; }
  }
  :root[data-theme="dark"] .diagram-light { display: none; }
  :root[data-theme="dark"] .diagram-dark { display: block; }
  .diagram-desc { padding: 0 16px 14px; color: var(--muted); font-size: 14px; }
  .previews { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 20px; }
  .previews figure { margin: 0; }
  .previews img { width: 100%; max-width: 360px; border: 1px solid var(--border); border-radius: 10px; }
  .previews figcaption { margin-top: 8px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .temp-item { border: 1px dashed var(--border); border-radius: 10px; padding: 10px 16px; margin-top: 10px; color: var(--muted); overflow-wrap: anywhere; }
  .temp-item .file-path { display: block; color: var(--text); margin-bottom: 2px; }
  .temp-revert code { color: var(--warn); }
  details.block > summary { cursor: pointer; list-style: none; }
  details.block > summary::-webkit-details-marker { display: none; }
  details.block > summary h2 { margin: 0; }
  details.block > summary h2::before { content: "▸"; color: var(--muted); font-size: 14px; transition: transform .15s; }
  details.block[open] > summary h2::before { transform: rotate(90deg); }
  details.block[open] > summary { margin-bottom: 12px; }
  .plain-list { list-style: none; padding: 0; margin: 6px 0 0; }
  .plain-list li { padding: 4px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
  .plain-list li:last-child { border-bottom: 0; }

  footer { max-width: 1080px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; }

  @media (max-width: 600px) {
    header { padding: 28px 16px 22px; }
    header h1 { font-size: 23px; }
    section { padding: 18px 16px; }
    .stat-value { font-size: 22px; }
  }

  /* Al imprimir, siempre claro: gana sobre el tema elegido con el botón o el del sistema (va después y pesa igual). */
  @media print {
    .theme-btn, .toc, .tabs { display: none; }
    :root, :root[data-theme], :root:not([data-theme="light"]) { --bg: #ffffff; --surface: #ffffff; --text: #1c1d21; --muted: #555a63; --border: #d5d8de; --soft: #f7f8fa; --accent: #3657d6; --accent-soft: #e9edfb; --before: #a3abb8; --after: #3657d6; --ok: #1e7f48; --ok-soft: #e3f4ea; --ko: #bf3a2f; --ko-soft: #fbe7e4; --same: #646872; --same-soft: #eef0f3; --warn: #9a6400; --warn-soft: #fff3d6; }
    body { background: #fff; font-size: 12.5px; }
    header { background: #333; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 20px 16px; }
    header .kicker { padding-right: 0; }
    main { padding-top: 8px; }
    section { border-color: #ccc; padding: 14px 16px; }
    .kpi, details.file > summary, .note, .temp-item, .diagram { break-inside: avoid; }
    .chip, .dl.add, .dl.del, .dl.hunk, .ex-before, .ex-after, .hchip { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* Lo plegado (los cambios no atribuidos) se imprime abierto, con su título. */
    details::details-content { content-visibility: visible; display: block; }
    details > summary::before, details.block > summary h2::before { content: none; }
    .table-wrap, .diff, pre.code { overflow: visible; }
    .diff-inner { display: block; }
    .dl, pre.code { white-space: pre-wrap; overflow-wrap: anywhere; }
    .diagram-dark { display: none !important; }
    .diagram-light { display: block !important; }
    th, table.units td { white-space: normal; }
    td code { overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<!-- El contenido lo genera scripts/report.py: de este archivo solo se usan los bloques style y script. -->

<script id="behavior">
  /* Tema: el del sistema por defecto; el botón lo cambia y la elección queda en localStorage (si el navegador lo
     permite: en una ventana privada o con el almacenamiento bloqueado, el reporte se ve igual). */
  (function () {
    var root = document.documentElement, btn = document.getElementById("theme-btn");
    if (!btn) return;
    function current() {
      return root.getAttribute("data-theme") || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
    function paint() {
      var dark = current() === "dark";
      btn.textContent = dark ? "☀ Claro" : "☾ Oscuro";
      btn.setAttribute("aria-label", dark ? "Cambiar al tema claro" : "Cambiar al tema oscuro");
    }
    try { var saved = localStorage.getItem("hb-implement-tema"); if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved); } catch (e) {}
    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("hb-implement-tema", next); } catch (e) {}
      paint();
    });
    try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint); } catch (e) {}
    paint();
  })();

  /* Pestañas de cada archivo modificado: antes, después y diff. */
  function switchTab(fileId, tab) {
    ["before", "after", "diff"].forEach(function (name) {
      var panel = document.getElementById(fileId + "-" + name), button = document.getElementById(fileId + "-tab-" + name);
      if (panel) panel.classList.toggle("active", name === tab);
      if (button) {
        button.classList.toggle("active", name === tab);
        button.setAttribute("aria-selected", name === tab ? "true" : "false");
      }
    });
  }
</script>

</body>
</html>
