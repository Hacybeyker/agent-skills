<style>
:root {
  color-scheme: light;
  --font-display: "Zilla Slab", "Rockwell", "Roboto Slab", Georgia, serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --paper: #f3f5f1;
  --grid: #e0e6df;
  --surface: #ffffff;
  --surface-2: #eef1ec;
  --surface-3: #e3e8e2;
  --ink: #17223b;
  --ink-2: #4a566e;
  --ink-3: #6f7a90;
  --rule: #d3dae2;
  --accent: #2743b8;
  --accent-strong: #1b3196;
  --accent-soft: #e2e8fb;
  --on-accent: #ffffff;
  --mark: #ffd84d;
  --mark-soft: #fff3c4;
  --mark-ink: #4a3b00;
  --mark-on: #1f1a00;
  --ok: #1d7a52;
  --ok-soft: #dff2e8;
  --warn: #9a5800;
  --warn-soft: #fbecd3;
  --bad: #b3261e;
  --bad-soft: #f9e1df;
  --violet: #6b3fa0;
  --violet-soft: #efe6f9;
  --shadow: 0 1px 2px rgb(23 34 59 / 0.06), 0 14px 32px -20px rgb(23 34 59 / 0.35);
  --topbar-bg: rgb(243 245 241 / 0.9);

  --code-bg: #f7f8f5;
  --hl-keyword: #7a3e9d;
  --hl-string: #1f7a4d;
  --hl-number: #b04500;
  --hl-comment: #6f7a90;
  --hl-title: #2743b8;
  --hl-type: #0e6a87;
  --hl-meta: #955500;
  --hl-attr: #8a4b08;
  --hl-add: #dff2e8;
  --hl-del: #f9e1df;

  --radius: 12px;
  --radius-sm: 7px;
  --sidebar-w: 300px;
  --topbar-h: 58px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0d1220;
    --grid: #161f33;
    --surface: #121a2b;
    --surface-2: #18223a;
    --surface-3: #202b47;
    --ink: #e6eaf3;
    --ink-2: #aab4c8;
    --ink-3: #8390a8;
    --rule: #28334d;
    --accent: #93a7ff;
    --accent-strong: #b8c5ff;
    --accent-soft: #1e2a55;
    --on-accent: #0d1220;
    --mark: #e8c43a;
    --mark-soft: #3a3113;
    --mark-ink: #ffe78a;
    --mark-on: #1f1a00;
    --ok: #5ccb99;
    --ok-soft: #10291e;
    --warn: #f0b44c;
    --warn-soft: #33260f;
    --bad: #f28b82;
    --bad-soft: #3a1917;
    --violet: #c9a8f5;
    --violet-soft: #2a1d40;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 16px 34px -20px rgb(0 0 0 / 0.85);
    --topbar-bg: rgb(13 18 32 / 0.88);
    --code-bg: #0f1627;
    --hl-keyword: #d7a3f5;
    --hl-string: #86d8ac;
    --hl-number: #f5aa66;
    --hl-comment: #8390a8;
    --hl-title: #a7b8ff;
    --hl-type: #74d3ea;
    --hl-meta: #f2c96e;
    --hl-attr: #f2b36e;
    --hl-add: #10291e;
    --hl-del: #3a1917;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0d1220;
  --grid: #161f33;
  --surface: #121a2b;
  --surface-2: #18223a;
  --surface-3: #202b47;
  --ink: #e6eaf3;
  --ink-2: #aab4c8;
  --ink-3: #8390a8;
  --rule: #28334d;
  --accent: #93a7ff;
  --accent-strong: #b8c5ff;
  --accent-soft: #1e2a55;
  --on-accent: #0d1220;
  --mark: #e8c43a;
  --mark-soft: #3a3113;
  --mark-ink: #ffe78a;
  --mark-on: #1f1a00;
  --ok: #5ccb99;
  --ok-soft: #10291e;
  --warn: #f0b44c;
  --warn-soft: #33260f;
  --bad: #f28b82;
  --bad-soft: #3a1917;
  --violet: #c9a8f5;
  --violet-soft: #2a1d40;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 16px 34px -20px rgb(0 0 0 / 0.85);
  --topbar-bg: rgb(13 18 32 / 0.88);
  --code-bg: #0f1627;
  --hl-keyword: #d7a3f5;
  --hl-string: #86d8ac;
  --hl-number: #f5aa66;
  --hl-comment: #8390a8;
  --hl-title: #a7b8ff;
  --hl-type: #74d3ea;
  --hl-meta: #f2c96e;
  --hl-attr: #f2b36e;
  --hl-add: #10291e;
  --hl-del: #3a1917;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img, svg { max-width: 100%; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }
.skip { position: absolute; left: 12px; top: 0; transform: translateY(-150%); background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 6px; z-index: 50; }
.skip:focus { transform: translateY(10px); }

/* ------------------------------------------------------------------ estructura */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}
.topbar {
  grid-column: 1 / -1;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  height: var(--topbar-h);
  padding-inline: 16px 20px;
  background: var(--topbar-bg);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--ink); text-decoration: none; }
.brand-mark { width: 30px; height: 30px; flex: none; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 20px; height: 20px; stroke: var(--on-accent); }
.brand-name { font: 700 1.2rem/1 var(--font-display); letter-spacing: 0.01em; }
.brand-root { font: 500 0.72rem/1 var(--font-mono); color: var(--ink-3); padding: 4px 6px; border: 1px solid var(--rule); border-radius: 5px; white-space: nowrap; }
.search { margin-left: auto; position: relative; width: min(360px, 40vw); }
.search input {
  width: 100%;
  height: 36px;
  padding: 0 38px 0 34px;
  border: 1px solid var(--rule);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink);
  font: 400 0.9rem/1 var(--font-body);
}
.search input::placeholder { color: var(--ink-3); }
.search .icon { position: absolute; left: 11px; top: 11px; color: var(--ink-3); }
.search kbd { position: absolute; right: 8px; top: 8px; }
kbd { font: 500 0.7rem/1 var(--font-mono); color: var(--ink-3); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--surface); }
.top-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px;
  display: inline-grid; place-items: center;
  border: 1px solid var(--rule);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
}
.icon-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.menu-btn { display: none; }

.sidebar {
  position: sticky;
  top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  padding: 16px 12px 28px;
  border-right: 1px solid var(--rule);
  background: var(--paper);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
main { min-width: 0; padding: 28px clamp(16px, 4vw, 52px) 96px; }
main.is-grid {
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-position: -1px -1px;
}
.page { max-width: 1080px; margin: 0 auto; }
.banner {
  max-width: 1080px;
  margin: 0 auto 18px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 10px 14px;
  border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  background: var(--warn-soft);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
}
.banner.info { border-color: color-mix(in srgb, var(--accent) 30%, transparent); background: var(--accent-soft); }

@media (max-width: 920px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-grid; }
  .sidebar {
    position: fixed;
    top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
    left: 0; bottom: 0;
    height: auto;
    width: min(86vw, 330px);
    z-index: 30;
    transform: translateX(-104%);
    transition: transform 0.2s ease;
    box-shadow: var(--shadow);
  }
  .app.nav-open .sidebar { transform: none; }
  .brand-root { display: none; }
  .search { width: auto; flex: 1; }
  .search kbd { display: none; }
}
@media (max-width: 480px) {
  .brand-name { display: none; }
  .topbar { gap: 8px; padding-inline: 12px; }
}

/* ------------------------------------------------------------------ navegación */
.nav-label { font: 600 0.68rem/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); padding: 16px 10px 8px; }
.nav-link {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px;
  border-radius: 8px;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 0.9rem;
  line-height: 1.3;
}
.nav-link:hover { background: var(--surface-2); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.nav-link .count { margin-left: auto; font: 500 0.72rem/1 var(--font-mono); color: var(--ink-3); }
.nav-topic { flex-direction: column; align-items: stretch; gap: 6px; }
.nav-topic-name { font-weight: 600; color: var(--ink); }
.mini { display: flex; align-items: center; gap: 8px; }
.mini-bar { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.mini-num { font: 500 0.7rem/1 var(--font-mono); color: var(--ink-3); min-width: 3.2ch; text-align: right; }
.nav-sub { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 8px 10px; padding-left: 8px; border-left: 1px solid var(--rule); }
.nav-sub .nav-link { font-size: 0.86rem; padding-block: 5px; }
.nav-mod { margin-top: 4px; }
.nav-mod > summary {
  list-style: none;
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.84rem;
  color: var(--ink-2);
}
.nav-mod > summary::-webkit-details-marker { display: none; }
.nav-mod > summary:hover { background: var(--surface-2); }
.nav-mod-id { font: 600 0.72rem/1 var(--font-mono); color: var(--ink-3); flex: none; }
.nav-mod-title { flex: 1; min-width: 0; }
.nav-count { font: 500 0.7rem/1 var(--font-mono); color: var(--ink-3); flex: none; }
.nav-lesson { display: grid; grid-template-columns: 10px 2.6em minmax(0, 1fr); align-items: baseline; gap: 7px; padding: 5px 10px; font-size: 0.83rem; }
.nav-lesson .lesson-id { font-size: 0.72rem; }
.nav-lesson-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot { margin-top: auto; padding: 18px 10px 0; display: flex; flex-direction: column; gap: 10px; font-size: 0.78rem; color: var(--ink-3); }
.side-foot .btn { justify-content: center; }

/* ------------------------------------------------------------------ piezas */
.eyebrow { margin: 0; font: 600 0.72rem/1.2 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.lesson-id { font: 600 0.8rem/1 var(--font-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.btn {
  display: inline-flex; align-items: center; gap: 0.5em;
  padding: 0.6em 1em;
  border: 1px solid var(--rule);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink);
  font: 600 0.88rem/1 var(--font-body);
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.small { padding: 0.45em 0.75em; font-size: 0.8rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.4em;
  padding: 0.32em 0.62em;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font: 500 0.74rem/1 var(--font-body);
  white-space: nowrap;
}
.chip.mono { font-family: var(--font-mono); letter-spacing: 0.02em; }
.chip[data-state="completada"] { background: var(--accent-soft); border-color: transparent; color: var(--accent-strong); }
.chip[data-state="convalidada"] { border-color: var(--accent); color: var(--accent); background: transparent; }
.chip[data-state="en-curso"] { background: var(--mark-soft); border-color: color-mix(in srgb, var(--mark) 70%, transparent); color: var(--mark-ink); }
.chip[data-state="pendiente"] { color: var(--ink-3); }

.sq, .dot {
  display: inline-block;
  flex: none;
  border: 1.5px solid var(--rule);
  background: var(--surface);
  border-radius: 3px;
}
.sq { width: 15px; height: 15px; }
.dot { width: 10px; height: 10px; border-radius: 2px; }
.sq[data-state="completada"], .dot[data-state="completada"] { background: var(--accent); border-color: var(--accent); }
.sq[data-state="convalidada"], .dot[data-state="convalidada"] {
  border-color: var(--accent);
  background: repeating-linear-gradient(135deg, var(--accent) 0 1.6px, transparent 1.6px 4px);
}
.sq[data-state="en-curso"], .dot[data-state="en-curso"] { background: var(--mark); border-color: var(--ink); }
a.sq { transition: transform 0.12s ease; }
a.sq:hover { transform: scale(1.3); }
.squares { display: flex; flex-wrap: wrap; gap: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sq { width: 12px; height: 12px; }

.level { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8rem; color: var(--ink-2); white-space: nowrap; }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.bars i { width: 3px; border-radius: 1px; background: var(--surface-3); }
.bars i:nth-child(1) { height: 5px; }
.bars i:nth-child(2) { height: 8px; }
.bars i:nth-child(3) { height: 10.5px; }
.bars i:nth-child(4) { height: 13px; }
.level[data-n="1"] .bars i:nth-child(-n+1),
.level[data-n="2"] .bars i:nth-child(-n+2),
.level[data-n="3"] .bars i:nth-child(-n+3),
.level[data-n="4"] .bars i:nth-child(-n+4) { background: var(--ink-2); }
.arrow { color: var(--ink-3); }

.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 14px; font-size: 0.82rem; color: var(--ink-3); }
.crumbs a { color: inherit; text-decoration: none; }
.crumbs a:hover { color: var(--accent); text-decoration: underline; }
.crumbs .sep { opacity: 0.6; }

.page-head { margin-bottom: 26px; }
.page-head h1 { margin: 6px 0 10px; font: 600 clamp(1.9rem, 3.6vw, 2.6rem)/1.12 var(--font-display); text-wrap: balance; letter-spacing: -0.005em; }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--ink-3); font-size: 0.84rem; }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px 22px; }
.section-title { font: 600 1.35rem/1.2 var(--font-display); margin: 40px 0 14px; }
.section-title small { font: 500 0.8rem/1 var(--font-body); color: var(--ink-3); margin-left: 8px; }

/* ------------------------------------------------------------------ inicio */
.dash-head h1 { font: 700 clamp(2.1rem, 4.6vw, 3.1rem)/1.05 var(--font-display); margin: 8px 0 10px; letter-spacing: -0.01em; }
.dash-sub { margin: 0; color: var(--ink-2); font-size: 1rem; }
.resume {
  margin-top: 26px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px 32px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 24px;
}
.resume h2 { margin: 6px 0 8px; font: 600 1.55rem/1.2 var(--font-display); text-wrap: balance; }
.resume-lesson { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 10px; margin: 0 0 6px; font-size: 1.05rem; }
.resume-side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.big-pct { font: 700 3rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.big-pct span { font-size: 1.3rem; color: var(--ink-3); margin-left: 2px; }
@media (max-width: 640px) {
  .resume { grid-template-columns: minmax(0, 1fr); }
  .resume-side { align-items: flex-start; flex-direction: row-reverse; justify-content: space-between; }
}
.topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 18px; }
.topic-card {
  display: flex; flex-direction: column; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.topic-card h3 { margin: 0; font: 600 1.25rem/1.25 var(--font-display); text-wrap: balance; }
.topic-card h3 a { color: var(--ink); text-decoration: none; }
.topic-card h3 a:hover { color: var(--accent); }
.tc-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.tc-stats { display: flex; align-items: baseline; gap: 8px; font-size: 0.86rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tc-stats strong { font: 700 1.25rem/1 var(--font-display); color: var(--ink); }
.tc-line { margin: 0; font-size: 0.88rem; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; }
.tc-line b { font-weight: 600; color: var(--ink-3); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; min-width: 5.2em; }
.tc-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 4px; }
.tc-main, .tc-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tc-side { flex: 1; }
.topic-grid.single { grid-template-columns: minmax(0, 1fr); }
.topic-grid.single .topic-card { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px 40px; }
@media (max-width: 720px) { .topic-grid.single .topic-card { grid-template-columns: minmax(0, 1fr); } }
.prompts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.prompt { background: var(--surface); border: 1px dashed var(--rule); border-radius: var(--radius-sm); padding: 12px 14px; }
.prompt code { font: 500 0.84rem/1.4 var(--font-mono); color: var(--ink); }
.prompt p { margin: 6px 0 0; font-size: 0.82rem; color: var(--ink-3); }

/* ------------------------------------------------------------------ tema */
.progress-panel { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px 32px; }
@media (max-width: 760px) { .progress-panel { grid-template-columns: minmax(0, 1fr); } }
.progress-summary { display: flex; flex-direction: column; gap: 10px; }
.progress-summary .big-pct { font-size: 3.4rem; }
.mod-rows { display: flex; flex-direction: column; gap: 10px; }
.mod-row { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.mod-row .nav-mod-id { font-size: 0.78rem; }
.mod-row-title { font-size: 0.88rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mod-row .squares { grid-column: 2 / 3; }
.mod-row .nav-count { grid-row: 1 / span 2; grid-column: 3; }
.next-step {
  margin-top: 16px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px;
  padding: 14px 18px;
  border-radius: var(--radius);
  background: var(--mark-soft);
  border: 1px solid color-mix(in srgb, var(--mark) 70%, transparent);
}
.next-step p { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.next-step .lesson-id { color: var(--mark-ink); }
.quick-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.module { padding: 22px 0 8px; border-top: 1px solid var(--rule); }
.module:first-of-type { border-top: 0; padding-top: 6px; }
.module-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 4px; }
.module-head h3 { margin: 0; font: 600 1.2rem/1.25 var(--font-display); }
.module-meta { margin: 4px 0 10px; color: var(--ink-2); font-size: 0.92rem; }
.module-meta p { margin: 0; }
.lesson-list { list-style: none; margin: 0; padding: 0; }
.lesson-row {
  display: grid;
  grid-template-columns: 16px 3.1em minmax(0, 1fr) auto;
  gap: 2px 10px;
  align-items: baseline;
  padding: 9px 10px;
  border-radius: 9px;
}
.lesson-row:hover { background: var(--surface); }
.lesson-row .sq { width: 13px; height: 13px; align-self: center; }
.lesson-row .l-title { font-weight: 600; color: var(--ink); text-decoration: none; }
.lesson-row .l-title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.lesson-row .l-desc { grid-column: 3 / 5; color: var(--ink-2); font-size: 0.9rem; }
.lesson-row .l-desc p { margin: 0; }
.lesson-row .chip { justify-self: end; }
.lesson-row details { grid-column: 3 / 5; font-size: 0.86rem; color: var(--ink-2); }
.lesson-row details summary { cursor: pointer; color: var(--ink-3); width: max-content; }
.lesson-row details ul { margin: 6px 0 2px; padding-left: 1.1em; }
@media (max-width: 560px) {
  .lesson-row { grid-template-columns: 16px 3.1em minmax(0, 1fr); }
  .lesson-row .chip { grid-column: 3; justify-self: start; }
  .lesson-row .l-desc, .lesson-row details { grid-column: 3; }
}

/* ------------------------------------------------------------------ lección */
.reading { display: grid; grid-template-columns: minmax(0, 74ch) 210px; gap: 56px; align-items: start; }
@media (max-width: 1280px) { .reading { grid-template-columns: minmax(0, 74ch); } .toc { display: none; } }
.lesson-head h1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.lesson-head h1 .lesson-id { font-size: 1rem; padding: 5px 7px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink-2); }
.toc { position: sticky; top: calc(var(--topbar-h) + 28px); font-size: 0.82rem; border-left: 1px solid var(--rule); padding-left: 16px; }
.toc p { margin: 0 0 8px; }
.toc a { display: block; padding: 4px 0; color: var(--ink-3); text-decoration: none; line-height: 1.35; }
.toc a:hover, .toc a.active { color: var(--accent); }
.empty-note { border: 1px dashed var(--rule); border-radius: var(--radius); padding: 22px 24px; background: var(--surface); }
.empty-note h2 { margin: 0 0 8px; font: 600 1.2rem/1.3 var(--font-display); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 48px; }
.pager a {
  display: flex; flex-direction: column; gap: 4px;
  padding: 12px 16px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  text-decoration: none;
  min-width: 0;
}
.pager a:hover { border-color: var(--accent); }
.pager .next { text-align: right; align-items: flex-end; grid-column: 2; }
.pager small { color: var(--ink-3); font-size: 0.76rem; }
.pager span.t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

/* ------------------------------------------------------------------ prosa */
.prose { font-size: 1.0625rem; line-height: 1.72; overflow-wrap: break-word; }
.prose > :first-child { margin-top: 0; }
.prose h1, .prose h2, .prose h3, .prose h4 { font-family: var(--font-display); line-height: 1.22; text-wrap: balance; scroll-margin-top: calc(var(--topbar-h) + 20px); }
.prose h1 { font-size: 2rem; margin: 0 0 0.6em; }
.prose h2 { font-size: 1.5rem; margin: 2.2em 0 0.6em; padding-top: 0.9em; border-top: 1px solid var(--rule); }
.prose h3 { font-size: 1.2rem; margin: 1.8em 0 0.5em; }
.prose h4 { font-size: 1.02rem; margin: 1.5em 0 0.4em; }
.prose p, .prose ul, .prose ol { margin: 0.8em 0; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: 0.3em 0; }
.prose li::marker { color: var(--ink-3); }
.prose a { text-decoration-thickness: 1px; text-underline-offset: 3px; }
.prose a.ext::after { content: "\2197"; font-size: 0.75em; margin-left: 2px; color: var(--ink-3); }
.prose a.broken { color: var(--bad); text-decoration-style: wavy; cursor: help; }
.prose strong { font-weight: 700; }
.prose p strong, .prose li strong { background: linear-gradient(transparent 60%, var(--mark-soft) 60%); padding: 0 1px; }
.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }
.prose blockquote { margin: 1.2em 0; padding: 0.2em 0 0.2em 1.1em; border-left: 3px solid var(--rule); color: var(--ink-2); }
.prose > blockquote:first-of-type:not(.callout) { font: 500 1.2rem/1.5 var(--font-display); color: var(--ink); border-left-color: var(--accent); }
.prose code {
  font: 400 0.86em/1.4 var(--font-mono);
  background: var(--surface-2);
  border: 1px solid var(--rule);
  border-radius: 5px;
  padding: 0.08em 0.35em;
}
.prose pre code { background: none; border: 0; padding: 0; font-size: inherit; line-height: inherit; }
.prose img { border-radius: var(--radius-sm); border: 1px solid var(--rule); }
.prose .raw-md { white-space: pre-wrap; font: 400 0.92rem/1.6 var(--font-mono); }
.table-wrap { overflow-x: auto; margin: 1.3em 0; border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: 0.92rem; line-height: 1.5; }
.prose th, .prose td { padding: 0.6em 0.8em; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
.prose th { background: var(--surface-2); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.prose tr:last-child td { border-bottom: 0; }
.prose td strong { background: none; }
.prose li.task { list-style: none; margin-left: -1.3em; display: flex; gap: 0.5em; align-items: baseline; }
.prose li.task input { accent-color: var(--accent); transform: translateY(1px); }
.code-block { margin: 1.3em 0; border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--code-bg); overflow: hidden; }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 6px 5px 14px; border-bottom: 1px solid var(--rule); font: 600 0.68rem/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.copy-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink-3); font: 500 0.74rem/1 var(--font-body); padding: 6px 8px; border-radius: 6px; cursor: pointer; letter-spacing: 0; text-transform: none; }
.copy-btn:hover { background: var(--surface-2); color: var(--ink); }
.code-block pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 400 0.86rem/1.62 var(--font-mono); tab-size: 4; color: var(--ink); }
figure.diagram { margin: 1.4em 0; padding: 18px; border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--surface); overflow-x: auto; text-align: center; }
figure.diagram svg { max-width: 100%; height: auto; }
figure.diagram svg[style*="min-width"] { max-width: none !important; }
.diagram-wait { color: var(--ink-3); font-size: 0.88rem; }
figure.diagram.failed { text-align: left; border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-soft); }
figure.diagram.failed pre { margin: 10px 0 0; white-space: pre-wrap; font: 400 0.8rem/1.5 var(--font-mono); color: var(--ink-2); }
.callout { border: 1px solid color-mix(in srgb, var(--c-fg) 28%, transparent); border-radius: var(--radius-sm); background: var(--c-bg); padding: 0.75em 1em; color: var(--ink); }
.prose blockquote.callout { border-left-width: 1px; font: inherit; }
.callout > :last-child { margin-bottom: 0; }
.callout > p:nth-child(2) { margin-top: 0.2em; }
.callout-title { display: flex; align-items: center; gap: 0.5em; font: 700 0.7rem/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-fg); }
.callout[data-kind="note"] { --c-fg: var(--accent); --c-bg: var(--accent-soft); }
.callout[data-kind="tip"] { --c-fg: var(--ok); --c-bg: var(--ok-soft); }
.callout[data-kind="important"] { --c-fg: var(--violet); --c-bg: var(--violet-soft); }
.callout[data-kind="warning"] { --c-fg: var(--warn); --c-bg: var(--warn-soft); }
.callout[data-kind="caution"] { --c-fg: var(--bad); --c-bg: var(--bad-soft); }
details.qa { margin: 0.8em 0; border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--surface); }
details.qa > summary {
  list-style: none;
  display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 0.5em;
  padding: 0.75em 1em;
  cursor: pointer;
  font-weight: 600;
  line-height: 1.45;
}
details.qa > summary::-webkit-details-marker { display: none; }
details.qa > summary::before {
  content: "?";
  display: inline-grid; place-items: center;
  width: 1.5em; height: 1.5em;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  font: 700 0.78rem/1 var(--font-mono);
  transform: translateY(0.1em);
}
details.qa[open] > summary { border-bottom: 1px dashed var(--rule); }
details.qa[open] > summary::before { content: "\2713"; background: var(--accent); color: var(--on-accent); }
details.qa > :not(summary) { margin-left: calc(1em + 2.1em); margin-right: 1em; }
details.qa > :last-child { margin-bottom: 0.9em; }
mark, .hit { background: var(--mark); color: var(--mark-on); border-radius: 2px; padding: 0 1px; }
.prose p strong mark { background: var(--mark); }

/* resaltado de código */
.hljs-comment, .hljs-quote { color: var(--hl-comment); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag, .hljs-section { color: var(--hl-keyword); }
.hljs-string, .hljs-regexp, .hljs-template-tag, .hljs-template-variable { color: var(--hl-string); }
.hljs-number, .hljs-symbol, .hljs-bullet, .hljs-link { color: var(--hl-number); }
.hljs-title, .hljs-title.function_, .hljs-name { color: var(--hl-title); }
.hljs-type, .hljs-built_in, .hljs-title.class_, .hljs-class .hljs-title { color: var(--hl-type); }
.hljs-meta, .hljs-meta .hljs-keyword, .hljs-annotation { color: var(--hl-meta); }
.hljs-attr, .hljs-attribute, .hljs-property, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id { color: var(--hl-attr); }
.hljs-variable, .hljs-params, .hljs-subst { color: var(--ink); }
.hljs-addition { background: var(--hl-add); }
.hljs-deletion { background: var(--hl-del); }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 700; }

/* ------------------------------------------------------------------ búsqueda, filtros, avisos */
.filter { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
.filter input { flex: 1; max-width: 420px; height: 38px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 9px; background: var(--surface); color: var(--ink); font: inherit; font-size: 0.92rem; }
.filter .muted { font-size: 0.84rem; }
.results { display: flex; flex-direction: column; }
.result { padding: 14px 4px; border-bottom: 1px solid var(--rule); }
.result a.r-title { font-weight: 700; text-decoration: none; }
.result a.r-title:hover { text-decoration: underline; text-underline-offset: 3px; }
.result .r-where { margin-left: 8px; }
.result p { margin: 6px 0 0; color: var(--ink-2); font-size: 0.92rem; }
.welcome { max-width: 760px; }
.welcome h1 { font: 700 clamp(2rem, 5vw, 3rem)/1.08 var(--font-display); margin: 8px 0 14px; }
.welcome ol { padding-left: 1.2em; }
.welcome li { margin: 0.5em 0; }
.welcome code, .panel code, .notice code, .banner code { font: 400 0.85em/1.4 var(--font-mono); background: var(--surface-2); border: 1px solid var(--rule); border-radius: 5px; padding: 0.05em 0.35em; }
.loading { color: var(--ink-3); padding: 40px 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
@media print {
  .topbar, .sidebar, .toc, .pager, .copy-btn, .banner, .filter, .quick-links, .tc-actions, .skip { display: none !important; }
  .app { display: block; }
  main { padding: 0; background: none !important; }
  body { background: #fff; color: #000; }
  .reading { display: block; }
  .code-block, figure.diagram, details.qa, .table-wrap, .panel { break-inside: avoid; }
}
</style>

      if (entry.kind === "directory") await readHandle(entry, prefix + entry.name + "/", out, depth + 1, sig);
      else if (/\.md$/.test(entry.name)) {
        var file = await entry.getFile();
        out[prefix + entry.name] = (await file.text()).replace(/\r\n/g, "\n");
        sig.push(prefix + entry.name + ":" + file.size + ":" + file.lastModified);
      }
    }
  }
  function useFiles(files, raiz, origin) {
    var norm = normalizeRoot(files, raiz);
    state.model = buildModel({ version: 1, generado: new Date().toISOString(), raiz: norm.raiz, archivos: norm.files });
    state.source = origin;
    updateChrome();
    if (!state.model.topics.length) {
      showBanner("warn", "No encontré planes de estudio (<tema>/PLAN.md) en esa carpeta. Elige la carpeta «aprendizaje» de tu proyecto.");
    } else {
      showBanner("info", "Leyendo la carpeta «" + norm.raiz + "» directamente" + (state.dirHandle ? ": los cambios se muestran solos." : ". Pulsa «Recargar carpeta» tras cada sesión."));
    }
  }
  async function loadFromHandle(silent) {
    var files = {}, sig = [];
    await readHandle(state.dirHandle, "", files, 0, sig);
    var signature = sig.sort().join("|");
    if (silent && signature === state.signature) return false;
    state.signature = signature;
    useFiles(files, state.dirHandle.name, "carpeta");
    return true;
  }
  function startPolling() {
    clearInterval(state.pollTimer);
    state.pollTimer = setInterval(async function () {
      if (doc.hidden || !state.dirHandle) return;
      try {
        if (await loadFromHandle(true)) { state.keepScroll = true; await render(); }
      } catch (e) { clearInterval(state.pollTimer); }
    }, 4000);
  }
  async function pickFolder() {
    if (window.showDirectoryPicker) {
      try {
        state.dirHandle = await window.showDirectoryPicker({ id: "coach-aprendizaje", mode: "read" });
        await loadFromHandle(false);
        startPolling();
        location.hash = "#/";
        await render();
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
        state.dirHandle = null;
      }
    }
    $("#folder-input").click();
  }
  function onFolderInput(ev) {
    var list = Array.prototype.slice.call(ev.target.files || []);
    if (!list.length) return;
    var files = {}, rootName = "";
    Promise.all(list.map(function (f) {
      var rel = f.webkitRelativePath || f.name;
      var segs = rel.split("/");
      rootName = segs[0];
      var inner = segs.slice(1);
      if (!/\.md$/.test(f.name) || inner.some(function (s) { return s.charAt(0) === "." || SKIP_DIRS[s]; })) return null;
      return f.text().then(function (text) { files[inner.join("/")] = text.replace(/\r\n/g, "\n"); });
    })).then(function () {
      useFiles(files, rootName, "carpeta");
      ev.target.value = "";
      location.hash = "#/";
      render();
    });
  }

  // ------------------------------------------------------------------ marco
  function showBanner(kind, text, actions) {
    var slot = $("#banner-slot");
    slot.replaceChildren();
    if (!text) return;
    slot.append(h("div", { class: "banner" + (kind === "info" ? " info" : ""), role: "status" }, icon(kind === "info" ? "info" : "alert"), h("span", null, text), actions || null));
  }
  function updateChrome() {
    var m = state.model;
    var rootLabel = $("#brand-root");
    if (m && m.data.raiz) { rootLabel.hidden = false; rootLabel.textContent = m.data.raiz; } else rootLabel.hidden = true;
    var gen = $("#generated");
    if (!m) gen.textContent = "";
    else if (state.source === "carpeta") gen.textContent = "Leído de la carpeta " + fmtDateTime(m.data.generado);
    else gen.textContent = "Generado " + fmtDateTime(m.data.generado) + ". Recarga la página tras cada sesión.";
    $("#reload-folder").hidden = state.source !== "carpeta";
  }
  function setNav(open) {
    $("#app").classList.toggle("nav-open", open);
    $("#menu-btn").setAttribute("aria-expanded", open ? "true" : "false");
  }
  function bindChrome() {
    $("#menu-btn").addEventListener("click", function () { setNav(!$("#app").classList.contains("nav-open")); });
    $("#theme-btn").addEventListener("click", function () {
      var next = THEME_ORDER[(THEME_ORDER.indexOf(themeMode()) + 1) % THEME_ORDER.length];
      store.set("theme", next);
      applyTheme(next);
      rerenderDiagrams();
    });
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { if (themeMode() === "system") rerenderDiagrams(); });
    }
    $("#search-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var q = $("#search-input").value.trim();
      if (q) location.hash = R.search(q);
    });
    $("#open-folder").addEventListener("click", pickFolder);
    $("#reload-folder").addEventListener("click", async function () {
      if (state.dirHandle) { state.signature = ""; await loadFromHandle(false); state.keepScroll = true; render(); }
      else $("#folder-input").click();
    });
    $("#folder-input").addEventListener("change", onFolderInput);
    window.addEventListener("hashchange", render);
    window.addEventListener("beforeprint", function () { $$("details").forEach(function (d) { d.dataset.wasOpen = d.open ? "1" : ""; d.open = true; }); });
    window.addEventListener("afterprint", function () { $$("details").forEach(function (d) { d.open = d.dataset.wasOpen === "1"; }); });
    doc.addEventListener("keydown", function (e) {
      var tag = (e.target && e.target.tagName) || "";
      var typing = tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable);
      if (e.key === "Escape") { setNav(false); if (typing) e.target.blur(); return; }
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "/") { e.preventDefault(); $("#search-input").focus(); return; }
      var keys = currentPage && currentPage.keys;
      if (!keys) return;
      if (e.key === "ArrowLeft" && keys.prev) location.hash = R.lesson(keys.topic.slug, keys.prev.id);
      if (e.key === "ArrowRight" && keys.next) location.hash = R.lesson(keys.topic.slug, keys.next.id);
    });
    doc.addEventListener("click", function (e) {
      if ($("#app").classList.contains("nav-open") && !e.target.closest("#sidebar, #menu-btn")) setNav(false);
    });
  }

  async function init() {
    applyTheme(themeMode());
    bindChrome();
    var data = readJson("coach-data");
    if (data && typeof data === "object" && data.archivos) state.model = buildModel(data);
    updateChrome();
    var core = Promise.all([ensureLib("marked"), ensureLib("purify"), ensureLib("hljs")]);
    await Promise.race([core, sleep(12000)]);
    if (!window.marked || !window.DOMPurify) {
      showBanner("warn", "No se pudieron cargar las librerías del cuaderno (¿sin conexión?). Se muestra el texto sin formato. Pide al coach que ejecute «vendor» para usarlo sin internet.");
    }
    await render();
  }
  init();
})();
</script>
</body>
